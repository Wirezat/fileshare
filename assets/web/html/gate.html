{{define "gate"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Subpath}} — locked</title>
    <meta name="robots" content="noindex" />

    <link rel="stylesheet" href="/static/ui/index.css" />
    <link rel="stylesheet" href="/static/theme.css" />

    <script>
        (function () {
            const s = localStorage.getItem('theme');
            if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
                document.documentElement.classList.add('dark');
        })();
    </script>
</head>

<body class="app-shell">

    <header class="header">
        <span class="header-brand">
            <span class="header-logo">📂</span>
            <span>Fileshare</span>
        </span>
        <div class="header-right">
            <button class="btn btn-icon btn-sm btn-toggle" id="theme-toggle" onclick="toggleTheme()"
                title="Toggle theme">🌙</button>
        </div>
    </header>

    <div class="auth-main">
        <div class="auth-card">

            <div class="auth-header">
                <div class="auth-logo">🔒</div>
                <div class="auth-title">/{{.Subpath}}</div>
                <div class="auth-sub">This share is password protected</div>
            </div>

            <div class="auth-body">
                <!-- A plain form POST, not wui's initAuth: this page is public and
                     has to work without scripting, and the server already renders
                     the failed-attempt state. -->
                <form class="auth-panel active" method="post" action="{{.FormAction}}">
                    {{if .WrongCredentials}}
                    <div class="alert danger">
                        <span class="alert-icon">⚠</span>
                        <span>Wrong password.</span>
                    </div>
                    {{end}}

                    <div class="field">
                        <label class="field-label" for="gate-pw">Password</label>
                        <div class="input-wrap">
                            <input class="input has-end-icon" type="password" id="gate-pw" name="password"
                                autocomplete="current-password" autofocus />
                            <button type="button" class="gate-reveal" onclick="togglePw()" tabindex="-1"
                                aria-label="Show password">👁</button>
                        </div>
                    </div>

                    <div class="auth-footer">
                        <span></span>
                        <button class="btn btn-primary" type="submit">Unlock</button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <style>
        /* The reveal button is the one thing wui's .input-wrap has no piece for:
           .end-icon is pointer-events:none by design, being a state marker. */
        .gate-reveal {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            color: var(--text-faint);
        }

        .gate-reveal:hover { color: var(--text); }
    </style>

    <script>
        function togglePw() {
            const input = document.getElementById('gate-pw');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            input.nextElementSibling.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            input.focus();
        }

        function toggleTheme() {
            const dark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', dark ? 'dark' : 'light');
            updateThemeBtn();
        }

        function updateThemeBtn() {
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        }

        updateThemeBtn();
    </script>

</body>

</html>
{{end}}
