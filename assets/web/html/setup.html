<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fileshare — Setup</title>
    <meta name="robots" content="noindex" />

    <!-- Both are served unauthenticated: this page runs before an admin exists. -->
    <link rel="stylesheet" href="/static/ui/index.css" />
    <link rel="stylesheet" href="/static/theme.css" />

    <script>
        (function () {
            const s = localStorage.getItem('theme');
            if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
                document.documentElement.classList.add('dark');
        })();
    </script>
</head>

<body class="app-shell">

    <header class="header">
        <span class="header-brand">
            <span class="header-logo">📂</span>
            <span>Fileshare</span>
        </span>
        <div class="header-right">
            <button class="btn btn-icon btn-sm btn-toggle" id="theme-toggle" onclick="toggleTheme()"
                title="Toggle theme">🌙</button>
        </div>
    </header>

    <div class="auth-main">
        <div class="auth-card auth-card-wide">

            <div class="auth-header">
                <div class="auth-logo">🔑</div>
                <div class="auth-title">First run</div>
                <div class="auth-sub">Create the admin account. The setup code is printed in the server log.</div>
            </div>

            <div class="auth-body">
                <div class="auth-panel active form-stack">

                    <div class="field">
                        <label class="field-label" for="f-setup-code">Setup code</label>
                        <input class="input" type="text" id="f-setup-code" autocomplete="off" spellcheck="false"
                            autofocus />
                        <span class="field-caption">Look for “setup code” in the server log.</span>
                    </div>

                    <div class="field">
                        <label class="field-label" for="f-username">Username</label>
                        <input class="input" type="text" id="f-username" value="admin" autocomplete="username"
                            spellcheck="false" />
                    </div>

                    <div class="field">
                        <label class="field-label" for="f-password">Password</label>
                        <div class="input-wrap">
                            <input class="input has-end-icon" type="password" id="f-password"
                                autocomplete="new-password" />
                            <!-- Reveal on this field only: the confirm field's
                                 slot holds the match indicator, and the two
                                 cannot share one corner. -->
                            <button type="button" class="setup-reveal" onclick="togglePw()" tabindex="-1"
                                aria-label="Show password">👁</button>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field-label" for="f-confirm">Confirm password</label>
                        <div class="input-wrap">
                            <input class="input has-end-icon" type="password" id="f-confirm"
                                autocomplete="new-password" />
                            <span class="end-icon" id="pw-match"></span>
                        </div>
                    </div>

                    <div class="auth-footer">
                        <span class="status-msg" id="status"></span>
                        <button class="btn btn-primary" id="submit-btn" onclick="submitSetup()">Continue</button>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <style>
        /* Four fields need more room than a two-field sign-in card. */
        .auth-card-wide { max-width: 400px; }

        /* wui's .end-icon is a state marker and pointer-events:none by design,
           so a clickable reveal needs its own rule. */
        .setup-reveal {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            color: var(--text-faint);
        }

        .setup-reveal:hover { color: var(--text); }
    </style>

    <script>
        function togglePw() {
            const input = document.getElementById('f-password');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            input.nextElementSibling.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            input.focus();
        }

        function toggleTheme() {
            const dark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', dark ? 'dark' : 'light');
            updateThemeBtn();
        }

        function updateThemeBtn() {
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        }
        updateThemeBtn();

        function showStatus(msg, isErr) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status-msg ' + (isErr ? 'err' : 'ok');
        }

        // Same in-field ✓/✗ the settings page uses for a password change.
        function checkMatch() {
            const pw = document.getElementById('f-password').value;
            const confirm = document.getElementById('f-confirm').value;
            const marker = document.getElementById('pw-match');
            marker.className = 'end-icon';
            marker.textContent = '';
            if (!confirm) return;
            const same = pw === confirm;
            marker.classList.add(same ? 'ok' : 'bad');
            marker.textContent = same ? '✓' : '✗';
        }
        document.getElementById('f-password').addEventListener('input', checkMatch);
        document.getElementById('f-confirm').addEventListener('input', checkMatch);

        document.addEventListener('keydown', e => { if (e.key === 'Enter') submitSetup(); });

        async function submitSetup() {
            const setupCode = document.getElementById('f-setup-code').value.trim();
            const username = document.getElementById('f-username').value.trim();
            const password = document.getElementById('f-password').value;
            const confirm = document.getElementById('f-confirm').value;
            const btn = document.getElementById('submit-btn');

            if (!setupCode) return showStatus('Setup code is required — it is printed in the server log.', true);
            if (!username) return showStatus('Username cannot be empty.', true);
            if (!password) return showStatus('Password cannot be empty.', true);
            if (password !== confirm) return showStatus('Passwords do not match.', true);

            btn.disabled = true;
            try {
                const res = await fetch('/setup/api/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_username: username, new_password: password, setup_token: setupCode }),
                });
                if (res.ok) {
                    showStatus('Redirecting…', false);
                    setTimeout(() => { window.location.href = '/admin'; }, 800);
                } else {
                    showStatus((await res.text()) || 'Something went wrong.', true);
                    btn.disabled = false;
                }
            } catch {
                showStatus('Request failed.', true);
                btn.disabled = false;
            }
        }
    </script>

</body>

</html>
