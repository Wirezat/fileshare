<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fileshare — Admin</title>

  <!-- wui base layer, then fileshare's own colours. Order matters: theme.css
       overrides the generic fallbacks in tokens/base.css. -->
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/theme.css" />

  <!-- Classic (non-module) script on purpose: module scripts are deferred, so
       the dark class would land after first paint and flash white. -->
  <script>
    (function () {
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body class="app-shell">

  <header class="header">
    <a class="header-brand" href="/admin">
      <div class="header-logo">📂</div>
      <span>Fileshare</span>
      <span class="header-sub">/ admin</span>
    </a>
    <div class="header-right">
      <span class="header-sub" id="uptime-label">↑ …</span>
      <button data-wui-theme data-i18n-title="admin.toggle_theme"></button>

      <!-- Language picker. header.js fills the trigger with the active flag and
           wires each [data-lang] to i18n's setLang, which reloads the page. -->
      <div class="dropdown-wrap" data-wui-lang>
        <button data-dropdown-trigger></button>
        <div class="dropdown-panel">
          <button class="dropdown-item" data-lang="en">🇬🇧 English</button>
          <button class="dropdown-item" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>

      <!-- No wui user menu: header.js's dropdown hardcodes /personal and
           /demo/solve, which do not exist here. A plain sign-out link is the
           honest equivalent. -->
      <a class="btn btn-ghost btn-sm" href="/admin/logout" data-wui-logout data-i18n="admin.signout"></a>
    </div>
  </header>

  <div class="app-body">

    <!-- Filled by wui's header.js from the nav config passed to init(). -->
    <nav class="sidebar"></nav>

    <main class="main">
      <!-- renderPage() mounts here. .page is the flex column that supplies the
           section gap, so it doubles as the wui host. -->
      <div class="page" id="wui-page-content"></div>
    </main>

  </div>

  <script type="module" src="/admin/static/js/logs.js"></script>
</body>

</html>
