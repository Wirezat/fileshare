name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Module files are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag rules
        run: bash scripts/release-tag_test.sh

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Share folder with root-only content
        run: |
          sudo mkdir -p share/locked
          echo secret | sudo tee share/secret.txt > /dev/null
          sudo chown root:root share/secret.txt share/locked
          sudo chmod 0600 share/secret.txt
          sudo chmod 0755 share/locked

      - name: Build image
        run: docker build -t ghcr.io/wirezat/fileshare:latest .

      - name: Start
        run: docker compose -f compose.yaml up -d

      - name: Container becomes healthy
        run: |
          id=$(docker compose -f compose.yaml ps -q fileshare || true)
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$id" 2>/dev/null || true)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 1
          done
          echo "last health status: $status"
          docker compose -f compose.yaml logs
          exit 1

      - name: Admin answers
        run: |
          for _ in $(seq 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:27182/admin || true)
            if [ "$code" = 303 ] || [ "$code" = 401 ]; then exit 0; fi
            sleep 1
          done
          echo "last status: $code"
          docker compose -f compose.yaml logs
          exit 1

      - name: Setup code in logs
        run: docker compose -f compose.yaml logs | grep 'setup code'

      - name: Check reads and writes root-only files
        run: |
          fixture=$(mktemp -d)
          cat > "$fixture/data.json" <<'JSON'
          {"files": {
            "secret": {"path": "/share/secret.txt"},
            "locked": {"path": "/share/locked", "allow_post": true}
          }}
          JSON
          out=$(docker compose -f compose.yaml run -T --rm -v "$fixture:/fixture" -e FS_DATA_DIR=/fixture fileshare check)
          printf '%s\n' "$out"
          [ -z "$out" ]

      - name: Stop
        if: always()
        run: docker compose -f compose.yaml down -v
