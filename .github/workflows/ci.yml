name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Dockerfile and go.mod use the same Go version
        run: |
          want="$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod)"
          grep -q "^FROM .*golang:$want-" Dockerfile

      - name: Module files are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  release-tag:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Tag rules
        run: bash scripts/release-tag_test.sh

  tarball:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build tarballs
        run: bash scripts/build-release.sh 0.0.0 dist

      - name: Tarballs hold binary, UI and installer
        run: |
          for arch in amd64 arm64; do
            list="$(tar -tzf dist/fileshare-v0.0.0-linux-$arch.tar.gz)"
            for f in fileshare-backend assets/web/ui/index.css scripts/fileshare-installer.sh; do
              grep -q "/$f$" <<< "$list" || { echo "$arch tarball misses $f" >&2; exit 1; }
            done
          done

  compose-smoke:
    timeout-minutes: 20
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: Share folder with root-only content
        run: |
          sudo mkdir -p share/locked
          echo secret | sudo tee share/secret.txt > /dev/null
          sudo chown root:root share/secret.txt share/locked
          sudo chmod 0600 share/secret.txt
          sudo chmod 0755 share/locked

      - name: Build image
        run: docker build -t ghcr.io/wirezat/fileshare:latest .

      - name: Start
        run: docker compose -f compose.yaml up -d

      - name: Container becomes healthy
        run: |
          id=$(docker compose -f compose.yaml ps -q fileshare || true)
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$id" 2>/dev/null || true)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 1
          done
          echo "last health status: $status"
          docker compose -f compose.yaml logs
          exit 1

      - name: Admin answers
        run: |
          for _ in $(seq 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:27182/admin || true)
            if [ "$code" = 303 ] || [ "$code" = 401 ]; then exit 0; fi
            sleep 1
          done
          echo "last status: $code"
          docker compose -f compose.yaml logs
          exit 1

      - name: Setup code in logs
        run: docker compose -f compose.yaml logs | grep 'setup code'

      - name: Check reads and writes root-only files
        run: |
          fixture=$(mktemp -d)
          cat > "$fixture/data.json" <<'JSON'
          {"files": {
            "secret": {"path": "/share/secret.txt"},
            "locked": {"path": "/share/locked", "allow_post": true}
          }}
          JSON
          out=$(docker compose -f compose.yaml run -T --rm -v "$fixture:/fixture" -e FS_DATA_DIR=/fixture fileshare check)
          printf '%s\n' "$out"
          [ -z "$out" ]

      - name: Stop
        if: always()
        run: docker compose -f compose.yaml down -v
