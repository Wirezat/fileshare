name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -count=1 ./...

      - name: Version from tag
        id: version
        run: |
          version="$(bash scripts/release-tag.sh check "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build tarball
        run: |
          bash scripts/build-release.sh "${{ steps.version.outputs.version }}" dist
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --draft \
            --title "Linux, v${{ steps.version.outputs.version }}" \
            --notes ""
